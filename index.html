</audio>
<script>
"use strict";

const DEFAULT_STATE={
 registered:false,nickname:"主人",birthday:"",intro:"",reads:[],favorites:[],viewCount:0,likedFloors:{},
 duplicateVisible:false,currentHasebeDeleted:false,oldProfileUnlocked:false,horrorComplete:false,horrorRecovered:false,
 askedSwords:[],identityChoice:null,hiddenHistoryOpen:false,oldIdFound:false,passwordLead:false,
 talkRound:0,talkFailed:false,passwordKnown:false,legacyPassword:"",oldOwnerLoggedIn:false,truthKnown:false,
 unread:{},dms:{},ending:null,treeChanged:false,toolOpened:false,usedActions:[],aoeHints:[],cleanupStep:0,talkUsedOptions:{},bannedPosts:[],mirrorPostPendingBan:false,mirrorPostSteps:0,meltSeen:false,
 wakeSignalSent:false,wakeSignalRead:false,wakeForum:false
};
let S=load();
let view="home",currentPost=null,currentProfile=null,currentDM=null,searchTerm="";
let currentPostFresh=false;
let horrorScrollBound=false;
let horrorBottomTimer=null;
let dmBusy=false,dmSequenceToken=0;

let finalBgmFadeTimer = null;

function startFinalBgm(){
  const audio = document.getElementById("finalBgm");
  if(!audio) return;

  if(finalBgmFadeTimer){
    clearInterval(finalBgmFadeTimer);
    finalBgmFadeTimer = null;
  }

  audio.currentTime = 0;
  audio.volume = 0;

  audio.play().catch(err=>{
    console.log("BGM 播放失败：", err);
  });

  const targetVolume = 0.32;

  finalBgmFadeTimer = setInterval(()=>{
    audio.volume = Math.min(targetVolume, audio.volume + 0.01);

    if(audio.volume >= targetVolume){
      clearInterval(finalBgmFadeTimer);
      finalBgmFadeTimer = null;
    }
  },120);
}

function fadeOutFinalBgm(duration = 4500){
  const audio = document.getElementById("finalBgm");
  if(!audio || audio.paused) return;

  if(finalBgmFadeTimer){
    clearInterval(finalBgmFadeTimer);
  }

  const startVolume = audio.volume;
  const steps = 40;
  const stepTime = duration / steps;
  let currentStep = 0;

  finalBgmFadeTimer = setInterval(()=>{
    currentStep++;

    audio.volume = Math.max(
      0,
      startVolume * (1 - currentStep / steps)
    );

    if(currentStep >= steps){
      clearInterval(finalBgmFadeTimer);
      finalBgmFadeTimer = null;

      audio.pause();
      audio.currentTime = 0;
      audio.volume = startVolume;
    }
  },stepTime);
}

 hasebe_here:{id:"hasebe_here",name:"へし切長谷部",avatar:"長",bio:"主命とあらば。",space:["主人今天精神比昨天好一些。药研说恢复得不错，但还是不能熬夜。","重新注册的论坛账号已经能正常用了。主人忘了密码这种小事交给我处理就好。","茶放凉了两次。第三次总算在温的时候喝完了。","晚饭只吃了一半。明天让歌仙换个清淡一点的做法。","夜里如果头疼就叫我。不要因为不想麻烦别人硬撑。"]},
 hasebe_trace:{id:"hasebe_trace",name:"へし切長谷部",avatar:"長",bio:"",space:[]},
 midare:{id:"midare",name:"乱藤四郎",avatar:"乱",bio:"今天也要可爱地出阵！",space:["新买的发饰到了！比照片上还可爱，明天戴给主人看。","主人今天看起来精神一点了。虽然只说了几句话，但至少没有一直皱眉。","厨房说草莓只剩一点，我先预定明天的甜点份额！","出阵服的袖口终于补好了，线的颜色居然完全看不出来。","晚上和五虎退一起给小老虎梳毛。结果我的衣服上全是毛。"]},
 yagen:{id:"yagen",name:"药研藤四郎",avatar:"药",bio:"身体不舒服就来找我。",space:["药箱盘点完毕。缺的几样已经记在采购单上。","大将恢复期的药方不许谁擅自改，包括大将本人。","今天体温正常。睡眠时间还是不够，晚上得再盯一次。","手入室的纱布快用完了，明天让博多一起补库存。","提醒：药不是觉得自己好了就能停。看到这条的人自己对号入座。"]},
 kasen:{id:"kasen",name:"歌仙兼定",avatar:"歌",bio:"风雅也是日常的一部分。",space:["庭里的桔梗开了。雨后颜色很好，可惜风有些凉。","今日的晚膳还算风雅。给主人那份做得淡一些，至少肯吃了几口。","晒好的书页已经收回去，湿气重的日子还是不适合整理旧册。","廊下那盆花被风吹歪了，幸好没有摔碎。","明早若天气好，换一只浅色花瓶。屋里总该有一点像样的季节感。"]},
 tsuru:{id:"tsuru",name:"鹤丸国永",avatar:"鹤",bio:"人生需要惊吓。",space:["今天很安静。偶尔安静一点，也算一种意外吧。","屋顶上看见一片形状很奇怪的云，盯久了像只鹤。这个不算我自夸。","下午陪五虎退找小老虎，最后在被炉下面发现两只。","茶很好喝。青江说我难得坐着半个时辰没惹事——这评价也太过分了。","明天出阵名单没有我。看来可以光明正大地睡个懒觉。"]},
 hakata:{id:"hakata",name:"博多藤四郎",avatar:"博",bio:"账一定要算清楚。",space:["小判对账中。今天总算一文不少。","今日采购支出已经录完，厨房那边比预计省了一点。","远征收益表重新做了格式，终于不用每次翻表。","最近论坛在线人数总有一点对不上。不是钱，但看着一样难受。","明天要去仓库核库存，谁借东西没登记最好今晚自己补上。"]},
 sayo:{id:"sayo",name:"小夜左文字",avatar:"小",bio:"……",space:["柿子还没熟。","雨下了一整天。","檐下有一只鸟躲了很久。雨停以后才飞走。","今天没有出阵。刀擦过了。","晚上很安静。论坛比走廊吵。"]},
 aoe:{id:"aoe",name:"笑面青江",avatar:"青",bio:"看不见的东西，也不代表不存在哦。",space:["茶叶换了一罐，意外地不错。","最近没什么特别的事。能慢慢喝茶其实很难得。","把以前写的小工具重新整理了一遍，名字还是取得很随便。","夜里的服务器偶尔会自己亮指示灯。嗯？也可能只是我没关。","月亮很好。适合散步，也适合遇到一些不该遇到的东西——开玩笑的。"]},
 hori:{id:"hori",name:"堀川国广",avatar:"堀",bio:"有什么能帮忙的吗？",space:["整理旧资料。比想象中多很多。","今天把仓库目录重新抄了一份，缺页的地方先做了标记。","旧论坛有几条主题的时间戳对不上，已经另外记下来。","午后帮兼先生找了一会儿东西，最后发现就在他自己房里。","明天继续整理。希望不要再翻出旧系统里没归档的附件。"]},
 aki:{id:"aki",name:"秋田藤四郎",avatar:"秋",bio:"外面有好多新鲜事。",space:["今天在旧仓库附近捡到东西，已经交给歌仙先生了。","后山的樱花开了一点点！明天如果不下雨还想再去看。","风很大，走廊上的纸差点全吹跑，幸好压住了。","主人如果身体好一点，也可以坐在廊下看外面，不用走很远。","小老虎今天追着落叶跑了好久，我在旁边看得都累了。"]},
 kuri:{id:"kuri",name:"大俱利伽罗",avatar:"俱",bio:"我不打算和你们混熟。",space:["马当番换班。已经处理好了。","袖口缝好了，不需要别人帮。","今天的马很安静。","出阵准备完成。没有别的。","……别在这里留言问我晚饭吃什么。"]},
 gokotai:{id:"gokotai",name:"五虎退",avatar:"五",bio:"请、请多关照……",space:["小老虎今天很有精神。刚刚才终于都睡着。","走廊的风铃晚上又响了，可是窗户真的没有开。","有一只把球滚到柜子下面，大家帮忙才拿出来。","主人今天摸了小老虎的头，它高兴了好久。","明天想把垫子拿出去晒一晒，希望不要下雨。"]},
 yamanba:{id:"yamanba",name:"山姥切国广",avatar:"山",bio:"别一直盯着我看。",space:["整理论坛归档。旧主题比想象中乱。","被单洗了。没什么值得专门说的。","厨房的杯子被收走了，我找了半天。","有几条旧账号索引很奇怪。先记下来再说。","今天不想出门。这样也很好。"]},
 nansen:{id:"nansen",name:"南泉一文字",avatar:"南",bio:"都说了不是猫。",space:["不是我打翻的。先说在前面。","窗边晒得到太阳，坐了一会儿而已。不是猫晒太阳。","厨房有人放了小鱼干。我只是顺路看了一眼，喵……啧。","旧归档里有张房间照片位置对不上，改天再找纸本核对。","今天没有抓任何东西。也没有挠门。"]},
 shokudaikiri:{id:"shokudaikiri",name:"烛台切光忠",avatar:"烛",bio:"今天也要帅气地做好饭。",space:["晚饭准备好了。主人的那份单独做得清淡一些。","厨房库存补齐。鸡蛋和米都够到下一次采购。","明早做玉子烧，甜口和普通口味各一份。","夜里厨房已经锁门。想吃东西的等天亮再来。","新到的茶不错，下午可以和大家一起试试。"]},
 admin:{id:"admin",name:"管理员",avatar:"管",bio:"论坛维护账号",space:["例行备份完成。","今日主题索引已更新。","已清理两条重复缓存记录。","茶水间板块权限检查完成。","历史附件恢复任务仍在运行。"]}
};

const POSTS=[
{id:"P044",title:"如果有一天你发现“自己”已经回来了怎么办",author:"tsuru",board:"怪谈",when:"旧记录 · 05-12",body:"假设啊。<br><br>你出门远征三天。<br><br>回来的时候，却发现本丸里已经有一个“你”了。<br><br>他认识所有人。<br>所有人也认识他。<br><br>那你还进去吗？",replies:[["midare","什么嘛，好吓人！"],["hakata","先让他还我的钱。"],["kasen","这种怪谈毫无风雅。"],["hasebe_trace","如果主人认得我，我就进去。"]],requires:"afterDelete",closedText:"本主题因内容不适宜，已停止回复。"},
{id:"P045",title:"【记录】近侍日志 / 无异常",author:"hasebe_trace",board:"旧帖",when:"旧记录 · 07-03",body:"主人今日状态稳定。午后有些困，晚饭前睡了一会儿。药已按时服用。夜间无异常。",replies:[["yagen","体温记录我收到了。今晚那次药别忘。"],["hasebe_trace","知道。"],["midare","主人今天终于肯吃一点甜的了？"],["hasebe_trace","只吃了一点。不能由着主人。"]],requires:"afterDelete",melt:true},
{id:"P040",title:"【紧急记录】西侧结界遭到突袭时的联络帖",author:"hori",board:"旧帖",when:"归档记录 · 11-03 23:41",body:"西侧结界遭到时间溯行军突袭，现有联络术式不稳定。还能够读取论坛的人请只回复所在位置、伤员数量和能够行动的人数，不要在楼里反复询问主人位置。已派人前往确认。",replies:[["kasen","东侧回廊还能通行。轻伤两振，已经往手入室送。"],["yagen","手入室这边还收得到消息。重伤的先送，不要自己判断还能不能撑。"],["tsuru","北侧刚清完一批，但外面还有。别把门全开。"],["hori","仓库方向的联络断过一次，现在重新接上了。"],["hasebe_trace","主人在我这里。不要再派人过来。"],["yagen","收到。既然长谷部在主人那边，其余人按原分组行动。"],["sayo","西侧还有声音。"],["kasen","所有人注意，不要为了回帖停在原地。"]],requires:"history"},
{id:"P041",title:"主人那边现在是谁守着？",author:"midare",board:"旧帖",when:"归档记录 · 11-03 23:53",body:"刚才有人说主人那边也被波及了，我这边过不去。谁离得近？至少回一句主人现在是不是安全。不要让我一直刷页面。",replies:[["hori","我刚从中庭过去，路被堵了。"],["yagen","主人之前有受伤，但具体情况我看不到。"],["hasebe_trace","我在。"],["midare","长谷部？主人呢？"],["hasebe_trace","还活着。"],["midare","……好。你别只回三个字啊。"],["tsuru","乱，先做你那边该做的。长谷部不会离开主人。"],["midare","我知道。就是因为知道才更担心。"]],requires:"history"},
{id:"P042",title:"【袭击记录】还能行动的人报一下位置",author:"yagen",board:"旧帖",when:"归档记录 · 11-04 00:08",body:"时间溯行军第二次压进来以后，现实里的传讯已经乱了。论坛还能用就先拿这里顶一下。能行动的报位置，不能行动的让旁边的人代报。最重要的一条：不要单独去找大将，长谷部已经在大将身边。",replies:[["hakata","库房外，能动。小判先不管了。"],["gokotai","南廊，能、能动。小老虎也都在。"],["yamanba","中庭。还能战斗。"],["kasen","东侧，正往内侧撤。"],["sayo","西侧。"],["tsuru","北边。暂时还能撑。"],["yagen","收到。所有人别逞强。"],["admin","论坛可能随时断开。若有必须留下的信息，使用定时发布。"]],requires:"history"},
{id:"P035",title:"厨房还有没有热水？我想泡点茶",author:"yamanba",board:"日常",when:"今天 23:16",body:"刚整理完一批旧归档，眼睛有点酸。厨房如果还有热水我就自己去，不用特意烧。顺便问一句，谁把我放在廊下的杯子挪走了。",replies:[["shokudaikiri","有，我刚换过一壶。杯子也在厨房，我怕晚上起风吹倒就先收进来了。"],["yamanba","……知道了。"],["tsuru","被单先生居然会主动发帖找杯子，真稀奇。"],["yamanba","闭嘴。"],["kasen","喝完早点休息。你今天盯屏幕太久了。"]]},
{id:"P036",title:"有人明天早上想吃玉子烧吗",author:"shokudaikiri",board:"茶水间",when:"今天 23:02",body:"明早本来准备做清淡一点的早餐。鸡蛋数量还够，如果想吃玉子烧就在这里留一句。主人的那份会另外做，不放太重的调味。半夜看到帖子的也不要现在跑来厨房，我已经锁门了。",replies:[["midare","我要！甜一点的！"],["hakata","我也要，不过别太甜。"],["tsuru","半夜不能去厨房这句是在针对谁？"],["shokudaikiri","你觉得呢？"],["gokotai","我、我也想要一小份。"],["kasen","给主人配一点粥就好。"]]},
{id:"P037",title:"小老虎把球滚进柜子底下了……",author:"gokotai",board:"日常",when:"今天 22:47",body:"最小的那只一直趴在柜子前面叫，可是柜子太重，我一个人不敢挪。球应该就在最里面。如果有人路过我的房间，可以帮忙抬一下吗？不用现在特意过来！",replies:[["yamanba","我过去。"],["gokotai","谢谢！真的不用很急。"],["midare","我也去！顺便看看小老虎。"],["kuri","两个人够了。别为了一个球把柜子掀了。"],["tsuru","如果柜子底下还有别的东西——"],["gokotai","鹤丸先生不要说了……"]]},
{id:"P038",title:"借针线，深色的线最好",author:"kuri",board:"日常",when:"今天 22:29",body:"袖口开了一点。不需要谁帮我缝，只借针和深色线。放在哪里告诉我。",replies:[["kasen","我房里第二个抽屉。你自己拿。"],["kuri","知道了。"],["midare","真的不用我帮你吗？我缝得很快哦。"],["kuri","不用。"],["tsuru","要不要顺便绣只猫？"],["nansen","为什么又扯到猫，喵！"]]},
{id:"P039",title:"明天出阵的便当要不要多准备一份",author:"hori",board:"日常",when:"今天 22:13",body:"名单刚改过一次，我怕厨房那边拿到的是旧版。明早出阵的人如果看到这帖，麻烦确认一下自己的名字。我已经把纸本送去烛台切那里了。",replies:[["shokudaikiri","收到了，我会按新版准备。"],["hakata","我的名字还在。"],["sayo","我也在。"],["hori","好，我再核一次。"],["tsuru","多一份也没关系嘛，回来当夜宵。"],["shokudaikiri","不行，数量还是要算准。"]]},
{id:"P017",title:"为什么论坛在线人数总比列表里多1",author:"hakata",board:"求助",when:"今天 22:04",body:"又算了一遍。不是显示延迟，也不是我漏算了远征中的人。管理员账号、自动登录和挂着页面没关的我都排除了，前台数字还是比我能数到的人多一个。要是有人知道论坛计数规则，来给我讲讲。",replies:[["admin","前台计数来自会话，不完全等于可见账号。"],["sayo","不是多出来的。"]],requires:"afterHorror"},
{id:"P013",autoBan:true,title:"在线人数是不是算错了",author:"hakata",board:"求助",when:"今天 21:31",body:"我把自动登录、远征账号、管理员账号都排除了。前台数字还是对不上。不是差很多，就差一个，所以更让人在意。",replies:[["admin","后台也存在一次无法归属的会话。正在查。"],["sayo","……"]],requires:"afterDelete"},
{id:"P010",title:"【管理员】关于近期论坛缓存异常",author:"admin",board:"公告",when:"今天 21:24",body:"近期部分旧主题出现索引时间与页面显示不一致的情况。旧系统迁移后的部分历史主题仅保留月日与时刻，年份字段可能为空。暂未发现账号泄露，不影响正常发帖与私信。个别主题可能会临时封禁处理。若遇到显示异常，请不要连续刷新。<br><br><b>如遇异常，请及时向管理员反馈。</b>",replies:[["hakata","所以前台人数和列表人数不一样也算这个？"],["admin","不一定相关。先按正常论坛使用即可。"]],requires:"afterDelete"},
{id:"P009",autoBan:true,title:"有人给旧帖子回复了",author:"midare",board:"杂谈",when:"今天 21:17",body:"我刚才真的看到旧帖最后多了一句东西，只有很短的一行。点回首页再进去就没了。我没有看错吧？我刚才还以为是谁在拿旧帖开玩笑，可刷新以后连那一行都没了。",replies:[["sayo","我也看到了。"],["midare","别吓我啊……"]],requires:"afterDelete"},
{id:"P008",autoBan:true,title:"【求助】为什么旧帖子会显示刚刚有新回复",author:"hori",board:"求助",when:"今天 21:03",body:"整理旧资料时发现，一条旧系统主题在列表里显示“刚刚有回复”，点进去却找不到新增楼层。我清了缓存又试了一次，时间还是会变。这个问题目前只出现在同一个账号参与过的几条旧帖里。",replies:[["admin","请不要连续刷新，正在检查索引。"],["hori","明白。我先把主题地址整理出来。"]],requires:"afterDelete"},
{id:"P012",autoBan:true,title:"长谷部这个账号以前是不是就有？",author:"yamanba",board:"杂谈",when:"今天 20:58",body:"今天整理论坛归档的时候看到很早以前的长谷部发言，点进现在的用户页又能对上同一个名字。我对论坛账号迁移不熟，这种情况是旧记录会自动挂到现在的账号下面吗？",replies:[["kasen","旧资料不要随便翻得太深。"],["hori","我也正好在整理，有些索引确实很奇怪。"]],requires:"afterDelete"},
{id:"P016",title:"【失物】捡到一个碎掉的御守",author:"aki",board:"失物",when:"今天 20:46",body:"我在旧仓库外面的石阶旁捡到一个碎掉的御守。外袋已经裂开了，里面的纸也沾了灰，但是绳结看起来很像主人以前会系的样子。我没有继续拆，先用纸包起来了。有人知道应该交给谁吗？",replies:[["kasen","交给我。先不要再碰里面。"],["aki","好的，我马上送过去。"]],requires:"afterDelete"},
{id:"P024",title:"今晚谁负责收内番衣服？",author:"gokotai",board:"日常",when:"今天 20:22",body:"晾衣架那边还有一批没有收，刚刚风变大了。我和小老虎可以去，但是被单太高够不到……如果有人正好经过，可以帮忙一起拿下来吗？",replies:[["yamanba","我去。"],["gokotai","谢谢山姥切先生！"]]},
{id:"P023",title:"烛台切说今晚有茶泡饭",author:"midare",board:"茶水间",when:"今天 19:48",body:"给主人那份做得特别清淡，我们的可以自己加东西。先说好，梅干只剩最后一点，不许所有人一起冲过去抢。",replies:[["shokudaikiri","我已经另外留了一小碟，不用抢。"],["tsuru","那还有什么惊喜可言。"],["midare","你离厨房远一点。"]]},
{id:"P022",title:"畑里的番茄到底是谁摘早了",author:"kasen",board:"当番",when:"今天 19:26",body:"今天检查畑当番记录时发现少了几个还没完全红的番茄。不是不能吃，而是至少应该等它们熟。若只是路过顺手摘了，现在承认还来得及，我不想明早对着所有人逐个问。",replies:[["hakata","不是我，我有采购记录证明。"],["tsuru","这听起来像一场很有趣的审问。"],["kuri","无聊。"]]},
{id:"P011",title:"今天主人吃得很少",author:"kasen",board:"茶水间",when:"今天 19:06",body:"晚饭几乎没有动。药研说恢复期食欲不稳正常，但这几天都这样也不是办法。我明早打算做粥，再配一点不刺激胃的东西。谁知道主人最近有没有特别想吃的，可以在下面说。",replies:[["yagen","先别勉强。能吃多少算多少。"],["hasebe_here","我会陪主人用餐。"],["shokudaikiri","我晚点再准备一点容易入口的。"]]},
{id:"P021",title:"谁把我的梳子拿去给小老虎梳毛了",author:"midare",board:"日常",when:"今天 18:55",body:"我不是不让用！可是至少用完要洗干净再放回来吧！现在上面全是毛！五虎退不用道歉，我知道肯定不是你主动拿的。",replies:[["gokotai","对、对不起……好像是最小的那只自己叼过去的。"],["midare","那就算了……它下次要梳毛直接来找我。"],["yagen","梳子洗干净就行。"]]},
{id:"P001",title:"【厨房】谁又把冰箱里的布丁吃了",author:"midare",board:"茶水间",when:"今天 18:42",body:"我明明写了名字！而且还是两个布丁！今天训练回来一路都在想它们，结果打开冰箱只剩空盒。今晚之前主动承认的话，可以只罚帮我梳头，不然我就去查厨房门口是谁路过了。",replies:[["nansen","别看我，我今天根本没进厨房，喵。"],["midare","我又没说是你！"],["shokudaikiri","我明天再做一份。冰箱里的东西吃掉记得留张纸。"]]},
{id:"P020",title:"明早有人要一起去看樱花吗",author:"aki",board:"日常",when:"今天 18:18",body:"后山那边今天已经开了一点！明早如果不下雨，我想早点去看看。主人要是身体允许的话也可以坐在廊下看，不用走很远。",replies:[["gokotai","我想去！"],["kasen","清晨风凉，主人若去要多披一件。"]]},
{id:"P002",title:"明天马当番有人换班吗",author:"kuri",board:"当番",when:"今天 17:10",body:"临时有事。原本排的是明早马当番，有人能与我换到后日就说一声。别为了这个专门改自己的安排。",replies:[["kasen","我替你。后日你换我的畑当番。"],["kuri","可以。"]]},
{id:"P003",title:"求推荐一个不会半夜响的风铃",author:"gokotai",board:"杂谈",when:"昨天 23:18",body:"走廊尽头那个风铃最近半夜会响，可是我检查过窗户，明明是关着的。昨天小老虎们也一起抬头看了很久。如果换成木头的会不会安静一点？",replies:[["midare","先换个地方挂试试看？"],["sayo","不是风的问题。"],["gokotai","小夜君不要这样说……"]]},
{id:"P005",title:"【远征】小判今天怎么这么少",author:"hakata",board:"远征",when:"昨天 20:04",body:"我算了好几遍，回来的人数、报酬和消耗都能对上，唯独小判少了一截。远征队回来以后都来我这里再对一次账，谁也不许说“差不多就行”。",replies:[["yagen","先把出发前库存再核一次。"],["hakata","我正在核。就是因为都对得上才奇怪。"]]},
{id:"P018",title:"【树洞】如果一个人已经忘记你了",author:"kasen",anon:true,board:"树洞",when:"旧记录 · 日期缺失",body:"如果一个人已经忘记你了，你还会继续等吗？不是说一定要等到他想起来。只是……如果你知道他还活着，却已经完全不记得你了。",replies:[["yagen","忘记也许是为了活下去。"],["hasebe_trace","只要主人平安，我记得就够了。"]],requires:"afterHorror"},
{id:"P019",title:"【技术分享】关于本丸论坛异常用户的处理方式",author:"aoe",board:"技术",when:"较早 · 02-17",body:"之前处理缓存残留时顺手做了一个归档程序。它不是给普通账号用的，如果确认某个历史账号长期保持非正常在线，可以试试这个：<a class='post-inline-link' href='javascript:void(0)' onclick=\"openTool();event.stopPropagation();\">网页链接</a>。程序会要求验证用户身份、留存原因和管理员密码。别拿活人的账号试哦。",replies:[["admin","未经审核的程序不要挂论坛。"],["aoe","所以我才写“异常用户”嘛。<br><br><b>要是看不明白三个验证项分别填什么，可以私信问我。</b>"]],requires:"ghost",tool:true},
{id:"P006",title:"鹤丸你把我的东西还回来",author:"hasebe_trace",board:"旧帖",when:"旧记录 · 04-21",body:"我最后说一次。主人的值班记录、备用钥匙和我抽屉里的便签都不是供你制造惊吓的道具。今天之内把东西原样放回去。尤其是备用钥匙，别再拿密码这件事开玩笑。",replies:[["tsuru","你连备用钥匙放哪都和主人生日有关，也太好猜了。"],["hasebe_trace","闭嘴。"],["tsuru","好好好，我还。"]]},
{id:"P007",title:"谁知道长谷部保险箱密码",author:"tsuru",board:"旧帖",when:"旧记录 · 04-23",body:"纯粹好奇。那家伙每次输密码都挡得严严实实，越挡越让人在意。有人猜过吗？先声明，我只是问问，不一定会真的去试。",replies:[["midare","不会是“主人第一”吧？"],["yagen","别乱试，锁了他真会生气。"],["tsuru","提示嘛……他记某个日子，比记自己的事牢得多。"],["hasebe_trace","鹤丸国永。"]]},
{id:"P004",title:"主人失忆以后我们说话是不是得注意点",author:"kasen",anon:true,board:"旧帖",when:"旧记录 · 日期缺失",body:"如题。有些事情是不是不应该现在就告诉主人？如果主人主动问到，又应该说到什么程度？",replies:[["yagen","先让大将的身体恢复。"],["kasen","别在论坛留下太具体的东西。"],["hasebe_trace","若主人问起，我会回答。"],["kasen","……你别在这个帖子里说得这么直接。"]],requires:"history"},
{id:"P014",title:"【游戏】来说一句绝对不能给主人听的话",author:"tsuru",board:"旧帖",when:"旧记录 · 06-09",body:"规则很简单：只说一句绝对不能当着主人面说的话。谁先被本人抓到谁输。不要删帖，删帖也算输。",replies:[["midare","主人夸我的时候我会偷偷记下来！"],["hakata","主人上次买东西根本没砍价。"],["hasebe_trace","……我并不满足于只是被主人需要。"],["tsuru","哇。这个可是真的不能让主人看到。"]],requires:"history"},
{id:"P015",title:"谁有主人以前房间的照片",author:"nansen",board:"旧帖",when:"旧记录 · 日期缺失",body:"管理员说旧备份坏了一部分。我记得以前有人拍过主人房间，尤其是书桌那边。不是要翻什么隐私，只是想确认一件东西以前到底放在哪里。",replies:[["kasen","我有纸本，不要传论坛。"],["yagen","旧登录便签也许还在抽屉夹层。"],["admin","恢复到关联历史用户：<OLDID>"]],requires:"history"}

];

const WAKE_POSTS=[
 {id:"W001",title:"大将，听得见吗",author:"yagen",board:"紧急",when:"刚刚",body:"大将。如果你还能看见这里，就别再往更深的地方睡了。脉搏一直都在，你和长谷部都还活着。听见我们的话，就回来。",replies:[["kasen","主人，醒来吧。大家都在这里。"],["midare","主人！快回来！"]]},
 {id:"W002",title:"主人，睁开眼睛",author:"midare",board:"日常",when:"刚刚",body:"主人！别再睡啦！我还有好多东西没来得及给主人看呢。你要是听得到，就快点睁开眼睛，好不好？",replies:[["gokotai","主、主人……小老虎们也都在等您。"],["yagen","继续叫。大将能听见的。"]]},
 {id:"W003",title:"睡得太久可一点也不风雅",author:"kasen",board:"杂谈",when:"刚刚",body:"主人，庭里的花已经开了。等您醒来，我再重新插一瓶放到房里。所以别再留在那个没有季节的地方了。回来吧。",replies:[["tsuru","这次我赞成歌仙。"],["sayo","外面有风。主人应该回来看看。"]]},
 {id:"W004",title:"喂，这个惊吓一点也不好笑啊",author:"tsuru",board:"杂谈",when:"刚刚",body:"主人，这次可真的把所有人都吓到了。要是你还打算继续睡，我以后拿什么惊吓你？差不多该反过来吓我们一跳，睁开眼吧。",replies:[["yamanba","别说废话。继续叫主人。"],["tsuru","我这不是正在叫吗。"]]},
 {id:"W005",title:"主人，再不起床我就念账本了",author:"hakata",board:"日常",when:"刚刚",body:"主人！我可先说好了，再不醒我就坐在旁边从今天的采购账念到远征收益表！这可比什么噩梦都吓人吧？所以快点醒来啦。",replies:[["yagen","这个办法说不定真的有效。"],["hakata","对吧！"]]},
 {id:"W006",title:"主人，回来吧",author:"sayo",board:"杂谈",when:"刚刚",body:"大家都在这里。没有人把您丢下。长谷部也还在。所以……不要一个人留在那里。",replies:[["kasen","嗯。没有人离开。"],["midare","主人不是一个人。"]]},
 {id:"W007",title:"主、主人，小老虎们一直在等您",author:"gokotai",board:"日常",when:"刚刚",body:"刚才有一只一直趴在您的被子旁边。它好像也知道主人还没醒。请、请快点回来吧。等您醒了，我再让它给主人摸摸头。",replies:[["midare","五虎退别哭啦，主人会醒的。"],["gokotai","嗯……一定会的。"]]},
 {id:"W008",title:"醒来以后给你做点好吃的",author:"shokudaikiri",board:"茶水间",when:"刚刚",body:"主人，厨房这边已经准备好了。等你醒来，不管是粥还是甜一点的东西都可以慢慢来。所以先睁开眼睛，好吗？",replies:[["kasen","第一顿还是清淡些。"],["shokudaikiri","当然。先让主人醒来再说。"]]},
 {id:"W009",title:"……主人，别让大家等太久",author:"yamanba",board:"日常",when:"刚刚",body:"我不知道这样叫有没有用。但既然药研说你听得见，那就听好了。大家都在等你。……我也是。回来。",replies:[["hori","兄弟说得对。主人，请回来。"]]},
 {id:"W010",title:"主人，如果听得到就顺着声音回来",author:"hori",board:"求助",when:"刚刚",body:"现实里的通讯没有断。我们一直都在这里说话。如果这个论坛还能把声音传给主人，那就别再相信里面那些已经结束的记录了。顺着我们的声音回来。",replies:[["yagen","对。现实还没有结束。"],["aoe","有时候出口一直都在，只是人不愿意回头看呢。"]]},
 {id:"W011",title:"这里不是主人该久留的地方哦",author:"aoe",board:"杂谈",when:"刚刚",body:"不管你现在看到的论坛有多像真的，它都不是你应该继续待下去的地方。既然已经能看到我们的字，就说明那边开始松动了。主人，睁开眼睛吧。",replies:[["sayo","回来。"],["tsuru","外面可比这里热闹多了。"]]},
 {id:"W012",title:"……醒过来",author:"kuri",board:"日常",when:"刚刚",body:"大家都在等。长谷部也还活着。够了。醒过来。",replies:[["midare","大俱利伽罗居然也发帖了！"],["kuri","吵死了。"]]}
];

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return Object.assign(clone(DEFAULT_STATE),JSON.parse(localStorage.getItem("honmaru_forum_v7_dual_guidance")||"{}"))}catch(e){return clone(DEFAULT_STATE)}}
function save(){localStorage.setItem("honmaru_forum_v7_dual_guidance",JSON.stringify(S))}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nameOf(id){let u=USERS[id];return typeof u?.name==="function"?u.name():u?.name||id}
function avatarOf(id){let u=USERS[id];return typeof u?.avatar==="function"?u.avatar():u?.avatar||"?"}
function birthdayCode(){return (S.birthday||"").replace(/\D/g,"")}
function oldOwnerId(){return S.nickname||"主人"}
function makeLegacyPassword(){let b=birthdayCode();return "hb-"+(b.slice(4)||"0000")+"-"+((S.nickname||"主").length+17)}
function userAvatarHTML(id,cls=""){return `<div class="avatar ${id.startsWith("hasebe")?"hasebe":""} ${cls}">${esc(avatarOf(id))}</div>`}

}

function floor(uid,body,no,anon=false){

  let label = isAnon ? "匿名" : nameOf(uid);

  let likeKey = currentPost + ":" + no;
  let liked = !!(S.likedFloors && S.likedFloors[likeKey]);

  return `
  <div class="floor">
    <div class="floor-user" ${isAnon ? "" : `onclick="openProfile('${uid}')"`}>
      ${
        isAnon
          ? `<div class="avatar">匿</div>`
          : userAvatarHTML(uid)
      }
      <div style="font-size:11px;margin-top:5px">${esc(label)}</div>
    </div>

    <div class="floor-body">
      <span class="floor-no">#${no}</span>

function likeFloor(postId, floorNo){
  if(!S.likedFloors){
    S.likedFloors = {};
  }

  const key = postId + ":" + floorNo;

  if(S.likedFloors[key]){
    delete S.likedFloors[key];
  }else{
    S.likedFloors[key] = true;
  }

  save();
  render();
}

function fadeToEnding(x,ms=2800){if(document.getElementById("endingCurtain"))return;let e=document.createElement("div");e.id="endingCurtain";e.className="ending-curtain";document.body.appendChild(e);requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add("show")));setTimeout(()=>{endGame(x);e.remove()},ms)}
function fadeToWakeEnding(ms=3400){
 if(document.getElementById("wakeCurtain"))return;
 let e=document.createElement("div");
 e.id="wakeCurtain";
 e.className="wake-curtain";
 document.body.appendChild(e);
 requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add("show")));
 setTimeout(()=>{endGame("he");e.remove()},ms);
}
function endGame(x){S.ending=x;save();render()}
function renderEnding(){
 let d={
  peace:["安息","账号归档完成。论坛在线人数终于和列表一致。","最后一次活动停在你按下确认的那一刻。"],
  ignore:["不再追问","你关闭了程序。","那个账号仍旧偶尔显示在线。没有人再提起这件事。"],
  hidden:["神隐","页面重新加载时，你的账号不在在线列表里。","右上角的在线人数，仍旧比列表多一个。"],
  true:["欢迎回来，主人。","论坛里的那个账号终于离线。","“还能再见吗。”"],
  he:["醒来","你睁开眼睛的时候，药研正守在旁边。","不远处，长谷部也刚刚睁开眼。这一次，没有谁被留在那个论坛里。"]
 }[S.ending];
 let cls=S.ending==="he"?"ending wake-ending":"ending";
 document.getElementById("app").innerHTML=`<div class="${cls}"><div class="ending-inner"><div class="small">本丸论坛</div><h1>${d[0]}</h1><p>${d[1]}</p><p>${d[2]}</p><button class="btn" onclick="resetGame()">重新开始</button></div></div>`
}

function modal(title,body,closable=true){document.getElementById("overlay").innerHTML=`<div class="modal"><div class="modal-card"><h2>${title}</h2>${body}${closable?`<div class="btnrow"><button class="btn" onclick="closeModal()">关闭</button></div>`:""}</div></div>`}
function closeModal(){document.getElementById("overlay").innerHTML=""}
function resetAsk(){modal("退出账号",`<p>退出并清除当前浏览器中的论坛记录？</p><div class="btnrow"><button class="btn dark" onclick="closeModal();resetGame()">清除并退出</button></div>`,true)}
function resetGame(){localStorage.removeItem("honmaru_forum_v7_dual_guidance");S=clone(DEFAULT_STATE);view="home";currentPost=null;currentProfile=null;currentDM=null;searchTerm="";currentPostFresh=false;render()}

render();
